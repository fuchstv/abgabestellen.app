<!DOCTYPE html>
<html lang="de" class="h-full antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>abgabestellen.app — Lebensmittel-Abgabestellen & Soziale Einrichtungen</title>
  <meta name="description" content="Kostenlose, unabhängige Übersicht von Lebensmittel-Abgabestellen, Suppenküchen und sozialen Einrichtungen.">
  <meta name="theme-color" content="#64ae24">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Ccircle cx='18' cy='18' r='17' fill='%2364ae24' stroke='%23533a20' stroke-width='2'/%3E%3Cpath d='M18 10.5c-1.8-2.1-5-2.1-6.8 0-1.8 2-1.8 5.2 0 7.3L18 24.8l6.8-7c1.8-2.1 1.8-5.3 0-7.3-1.8-2.1-5-2.1-6.8 0z' fill='%23ffffff'/%3E%3Cpath d='M9.5 25.5c2.2 1.8 5.2 2.8 8.5 2.8s6.3-1 8.5-2.8' fill='none' stroke='%23ffffff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('fs_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="h-full flex flex-col font-sans bg-fs-bg text-fs-text overflow-hidden">
  <div id="app" class="flex flex-col h-full overflow-hidden"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
